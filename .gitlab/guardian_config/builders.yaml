# builders.yaml

# 预设变量
# {target_path} 目标工程路径
# {output_path} 编译产物输出路径


# 默认构建器
default: build_sh

builders:
  cmake:
    commands:
      - "cmake -B {output_path} -G Ninja -S {target_path} -D WARN_AS_ERROR=true"
      - "cmake --build {output_path}"
    log_file: "build.log"

  build_sh:
    commands:
      - "./build.sh -B {output_path} -w"
    log_file: "build.log"
