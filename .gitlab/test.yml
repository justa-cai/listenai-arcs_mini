.git_config_init: &git_config_init
  - git config --global credential.helper store
  - echo "https://$CI_USER_NAME:$CI_USER_TOKEN@cloud.listenai.com" > ~/.git-credentials
  - git config --global --add safe.directory '*'
  - git config --global --add safe.directory ${CI_PROJECT_DIR}

.prepare_tools: &prepare_tools
  - curl -o ~/listenai-tools.tar.gz http://listenai-firmware-delivery.oss-cn-beijing.aliyuncs.com/ARCS/tools/dev-tools/linux-amd64/listenai-tools-20250312.tar.gz
  - tar -xzf ~/listenai-tools.tar.gz -C ~/
  - export LISTENAI_TOOLS_PATH=~/listenai-tools
  - rm -rf ~/listenai-tools.tar.gz

.prepare_guardian: &prepare_guardian
  - curl -o /usr/bin/guardian https://listenai-firmware-delivery.oss-cn-beijing.aliyuncs.com/tools/guardian/${GUARDIAN_VERSION}/guardian_linux_amd64
  - chmod +x /usr/bin/guardian
  - guardian -V

.find_device_by_serial: &find_device_by_serial
  - DEVICE_PORT=$(.gitlab/scripts/find_port_by_serial.py $TARGET_SERIAL_NUM)
  - export DEVICE_PORT="$DEVICE_PORT"

.update_device_config: &update_device_config
  - cp .gitlab/device_map/device_map.yaml /builds/device_map.yaml
  - .gitlab/scripts/update_device_map.py "$DEVICE_PORT" "/builds/device_map.yaml"
  - export DEVICE_MAP="/builds/device_map.yaml"


test:
  image: $DOCKER_SOURCE/arcs-sdk-ubuntu:v18.04-0.3.1
  stage: test
  interruptible: true
  tags:
    - generic
    - zgsz-03
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
  script:
    - *git_config_init
    - *find_device_by_serial
    - *update_device_config
    - *prepare_tools
    - *prepare_guardian
    - git reset --hard
    - git clean -f -d
    - guardian -C .gitlab/guardian_config/ -M ${DEVICE_MAP} ${GUARDIAN_TEST_PATH}
  artifacts:
    name: "test-result-$CI_JOB_NAME-$CI_JOB_ID"
    paths:
      - ${CI_PROJECT_DIR}/guardian-out/**/*.xml
      - ${CI_PROJECT_DIR}/guardian-out/test_plan.json
      - ${CI_PROJECT_DIR}/guardian-out/test_results.json
      - ${CI_PROJECT_DIR}/guardian-out/**/*.log
      - ${CI_PROJECT_DIR}/device-logs/*.log
    when: always
    reports:
      junit: guardian-out/test_results.xml
  cache:
    key: submodules-cache-${CI_PROJECT_ID}
    paths:
      - arcs-sdk
      - .git/modules
      - modules
    policy: pull-push
