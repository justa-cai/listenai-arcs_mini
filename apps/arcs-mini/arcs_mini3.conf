# ARCS Mini 3：8M PSRAM 双核分区（AP=3MB@0x28000000，CP=5MB@0x28300000），
# 需与 memap.h 的 8M PSRAM 分支保持同步。
CONFIG_MEM_PSRAM_BASE=0x28300000
CONFIG_MEM_PSRAM_SIZE=0x500000
# Reserve 4 KiB more CP SRAM for the Mini 3 USB host class drivers.
CONFIG_MEM_WFRAM_SIZE=0x16000
CONFIG_MEM_SRAM_BASE=0x20016000
CONFIG_MEM_SRAM_SIZE=0x2A000
# 8M 上给堆更多空间：日志上传缓冲 512KB→128KB 省出 384KB 静态，
# 连同 CP 区尾部空闲一起并入堆，供拍照 JPEG 路径使用。
CONFIG_PSRAM_HEAP_SIZE=0x370000
CONFIG_LOG_UPLOAD_BUFFER_CAPACITY_KB=128

CONFIG_AUDIO_DEFAULT_MIC_GAIN_A_DB=36
CONFIG_AUDIO_DEFAULT_MIC_GAIN_D_DB=0
CONFIG_AUDIO_DEFAULT_REF_GAIN_A_DB=26
CONFIG_AUDIO_DEFAULT_REF_GAIN_D_DB=0
CONFIG_AUDIO_DEFAULT_SPK_GAIN_A_DB=0
CONFIG_AUDIO_DEFAULT_SPK_GAIN_D_DB=-18
CONFIG_LSCHAT_WAKEUP_CLOUD_NOISE_GATE_THRESHOLD=256

CONFIG_CLOUD_PRODUCT_ID_DEFAULT="ff75f3fc-65d9-468f-91af-f616ec44e66e"
CONFIG_CLOUD_SECRET_ID_DEFAULT="94383c05-a1d8-4e5f-9046-b83c6f21df02"
