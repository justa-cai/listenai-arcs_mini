# LLM 服务固件（AP 核）：模型嵌入固件，上电自动加载，IPC 监听 chat。
# PSRAM 分割：AP 8MB / CP 8MB（契约见 memap.h）。

# AP 核（上电默认核，0x0 的 boot 完成时钟/PSRAM 初始化后跳入本应用）
CONFIG_ARCS_AP_CORE=y

# 应用侧绝不重复初始化时钟/PSRAM（与 boot 冲突）
CONFIG_BOOT_HART=n
CONFIG_BOOT=n

# 内存窗口
# Flash: AP 从 0x30040000 到 0x30680000（6.5MB，含模型 5.85MB + 代码）
CONFIG_MEM_FLASH_BASE=0x30040000
CONFIG_MEM_FLASH_SIZE=0x00640000

CONFIG_MEM_PSRAM_BASE=0x28000000
CONFIG_MEM_PSRAM_SIZE=0x00800000

# 共享区必须与 CP 侧完全一致（CP: IPC 0x20040000 / LUNA_SHARED 0x20042000+0x7000）
CONFIG_MEM_IPC_BASE=0x20040000
CONFIG_MEM_IPC_SIZE=0x00002000
CONFIG_MEM_LUNA_SHARED_BASE=0x20042000
CONFIG_MEM_LUNA_SHARED_SIZE=0x00007000

# 私有 SRAM：CP 占 0x20017000-0x20040000，共享区占到 0x20049000，
# AP 可用 0x20049000-0x20058000
CONFIG_MEM_SRAM_BASE=0x20049000
CONFIG_MEM_SRAM_SIZE=0x0000F000
CONFIG_MEM_APRAM_BASE=0x20058000
CONFIG_MEM_APRAM_SIZE=0x00000800

CONFIG_LINK_OPTION_NONE_SPECS=y
CONFIG_LINK_CPP_RUNTIME_SECTIONS=n
CONFIG_CPP_EXCEPTIONS=n

CONFIG_HEAP_SIZE=0x8000
CONFIG_PSRAM_HEAP_SIZE=0x100000

CONFIG_BACK_TRACE=y
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

CONFIG_MAIN_TASK_STACK_SIZE=4096
CONFIG_MAIN_TASK_PRIORITY=5

# IPC 骨架：HAL IPC 是底层必需（ipc_auto_init 发布共享内存 pattern）
CONFIG_ARCS_HAL_IPC=y
CONFIG_ARCS_HAL_LSF=y
CONFIG_IPC_LSF=y

# 响应 CP 的 halt/resume 信号（CP flash 写前暂停本核）
CONFIG_ARCS_HAL_IPC_HALT_BY_PEER_CORE=y

# AP 日志走 UART1（PA21，921600）
CONFIG_CONSOLE_UART_NAME="uart0"
