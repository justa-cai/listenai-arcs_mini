CONFIG_BOARD_ARCS_MINI_V3=y
CONFIG_BOARD_ARCS_MINI_MODEM_UART2_REMAP=n

# v3 uses a single SPI LCD on SPI0 CS/DC/PWM/RST.
CONFIG_LISA_DISPLAY_COMPOSITE=n
CONFIG_LISA_DISPLAY_TE_SYNC=y
CONFIG_LISA_DISPLAY_PANEL_ST7789P3=y
CONFIG_LISA_DISPLAY_PANEL_GC9D01N=n

# v3 LCD mounting uses a 180-degree display rotation.
# CONFIG_LV_DRIVER_ROTATE_NORMAL is not set
# CONFIG_LV_DRIVER_ROTATE_90 is not set
# CONFIG_LV_DRIVER_ROTATE_270 is not set
CONFIG_LV_DRIVER_ROTATE_180=y

# v3 pinmux exports I2C1 on PB0/PB1.
CONFIG_LISA_I2C0=n
CONFIG_LISA_I2C1=y

# CH32V003 external MCU on I2C1. It exposes exgpioa/exgpiob/exgpioc/exgpiod,
# exadc and expwm as LISA child devices.
CONFIG_LISA_CH32V003=y
CONFIG_LISA_CH32V003_I2C_DEVICE_NAME="i2c1"
CONFIG_LISA_CH32V003_I2C_ADDR=0x6c
CONFIG_LISA_CH32V003_GPIO=y
CONFIG_LISA_CH32V003_ADC=y
CONFIG_LISA_CH32V003_PWM=y

# No touch reset/int pins are present in the v3 pinmux export.
CONFIG_LISA_TOUCH_DEVICE=n
CONFIG_LISA_TOUCH_ARCS_CST328=n

CONFIG_BATTERY_COLLECTION_ADC_PAD="gpiob"
CONFIG_BATTERY_COLLECTION_ADC_CHANNEL=3
CONFIG_BATTERY_COLLECTION_CHARGE_DETECT_PAD="exgpiod"

# Keep the low-level audio driver PA control disabled. v3 PA mute is controlled
# by the external MCU through EXGPIO, not by a local SoC GPIO.
CONFIG_LISA_AUDIO_PLAY_PA_ENABLE=n
