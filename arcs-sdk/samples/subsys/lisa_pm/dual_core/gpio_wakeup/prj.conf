# CP 核应用：AP 由 remote/ 子工程独立产出，AP/CP 通过 IPC 组成 PM 双核模式。
CONFIG_BOOT=n
CONFIG_ARCS_CP_CORE=y

CONFIG_BACK_TRACE=y

CONFIG_PSRAM_HEAP_SIZE=0x40000

# 使 pm_impl 进入 CONFIG_CORE_NUM=2 的双核路径。
CONFIG_ARCS_HAL_IPC=y

# lisa_pm 框架。LISA_PM_DUAL_CORE 避免 CP 侧走单核 PM_CLOSE_AP boot-shim 路径。
CONFIG_LISA_PM=y
CONFIG_LISA_PM_CORE_PRIMARY=y
CONFIG_LISA_PM_DUAL_CORE=y
CONFIG_ARCS_HAL_PM_DEBUG=y
CONFIG_PM_SNAPSHOT_PSRAM_SIZE=0x10000
# 外部无BUCK供电关闭使能
CONFIG_ARCS_HAL_WCND_WIFI_PS_LDOCORE_TUNE=n
CONFIG_ARCS_HAL_WCND_WIFI_PS_LDOVMEM_TUNE=y

# WiFi + 同核 LWIP：本示例演示 PM 双核，不演示 WiFi 协议栈/LWIP 异核拆分。
CONFIG_LISA_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y
CONFIG_LWIP_DHCP_RESTORE_LAST_IP=y

CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y

# GPIOB_7 PMU 唤醒源依赖 lisa_device GPIOB wakeup_ops。
CONFIG_LISA_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOB=y

# AP 固件占 flash 起始 1MB，CP 镜像从 0x30100000 起；AP/CP 各使用 4MB PSRAM。
CONFIG_MEM_FLASH_BASE=0x30100000
CONFIG_MEM_FLASH_SIZE=0x00400000
CONFIG_MEM_PSRAM_BASE=0x28400000
CONFIG_MEM_PSRAM_SIZE=0x00400000
