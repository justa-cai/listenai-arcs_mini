# AP 核固件：PM 双核对端，负责引导 CP、初始化 IPC/lisa_pm 并保持运行。
CONFIG_ARCS_AP_CORE=y

CONFIG_BACK_TRACE=y
CONFIG_HEAP_SIZE=0x8000

CONFIG_ARCS_HAL_IPC=y

# AP 侧也通过 lisa_pm_init() 初始化 PM 框架，HAL PM/VRTC 由 lisa_pm 自动选择。
CONFIG_LISA_PM=y
CONFIG_LISA_PM_CORE_PRIMARY=n
CONFIG_ARCS_HAL_PM_DEBUG=y
CONFIG_PM_SNAPSHOT_PSRAM_SIZE=0x10000
# 外部无BUCK供电关闭使能
CONFIG_ARCS_HAL_WCND_WIFI_PS_LDOCORE_TUNE=n
CONFIG_ARCS_HAL_WCND_WIFI_PS_LDOVMEM_TUNE=y


CONFIG_MEM_FLASH_BASE=0x30000000
CONFIG_MEM_FLASH_SIZE=0x00100000
CONFIG_MEM_PSRAM_BASE=0x28000000
CONFIG_MEM_PSRAM_SIZE=0x00400000

# 未使用算法
CONFIG_MEM_APRAM_SIZE=0

CONFIG_CONSOLE_UART_NAME="uart1"
CONFIG_CONSOLE_UART_BAUDRATE=115200
CONFIG_SYSLOG_UART_DEVICE_UART1=y
CONFIG_SYSLOG_UART_PORT=1
CONFIG_SYSLOG_UART_BAUDRATE=115200
