# TinyUSB UAC2 Full-Speed sample: mic 16k/2ch/16bit, speaker 16k/1ch/16bit

# Single-core memory layout for audio/USB samples
CONFIG_MEM_SRAM_SIZE=0x00038000
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

# LISA Device Framework
CONFIG_LISA_DEVICE=y
CONFIG_LISA_AUDIO_DEVICE=y

# Memory and system
CONFIG_RINGBUF=y
CONFIG_HEAP_SIZE=0x10000
CONFIG_PSRAM_HEAP_SIZE=0x100000
CONFIG_LINK_OPTION_NOSYS_SPECS=y
CONFIG_MAIN_TASK_STACK_SIZE=4096

# TinyUSB
CONFIG_TINY_USB=y
CONFIG_TINY_USB_USE_CUSTOM_CONFIG_FILE=y
CONFIG_TINY_USB_CONFIG_FILE="tusb_config.h"

# UAC defaults
CONFIG_UAC_MIC_SAMPLE_RATE=16000
CONFIG_UAC_MIC_CHANNELS=2
CONFIG_UAC_MIC_SAMPLE_BITS=16
CONFIG_UAC_SPK_SAMPLE_RATE=16000
CONFIG_UAC_SPK_CHANNELS=1
CONFIG_UAC_SPK_SAMPLE_BITS=16

# Debug
CONFIG_LOG=y
CONFIG_LOG_LEVEL_DEBUG=y
CONFIG_BACK_TRACE=y
