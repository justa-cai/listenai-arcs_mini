# 项目可根据需要在此文件中设置对应的配置

# CherryUSB 配置
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_DEVICE=y
CONFIG_CHERRYUSB_APP_CLASS=y
CONFIG_CHERRYUSB_DEVICE_MUSB_LISA=y
# CONFIG_CHERRYUSB_DEVICE_ADB is intentionally NOT set:
# usbd_adb.c is a full ADB protocol stack that conflicts with adb.c.
# adb_device.c implements a raw vendor-endpoint transport so that
# adb.c handles the entire ADB protocol itself.

# 文件系统配置
CONFIG_FILE_SYSTEM=y
CONFIG_FATFS_FILESYSTEM=y
CONFIG_DISK_DRIVER=y
CONFIG_DISK_DRIVER_SDMMC=y

# 抽象文件系统
CONFIG_LSFS=y
CONFIG_LSFS_FAT=y

# ADB 配置
CONFIG_ADB=y
CONFIG_ADB_SYNC=y
CONFIG_ADB_PUSH_PULL_DEFAULT_ROOT="/SD:/adb/"
CONFIG_ADB_SHELL=y
CONFIG_ADB_SHELL_BUFFER_SIZE=1024

# Shell 配置
CONFIG_SDK_MODULE_LETTER_SHELL=y
CONFIG_SDK_MODULE_LETTER_SHELL_CONFIG_FILE="shell_cfg_user.h"

# 系统配置
CONFIG_LINK_OPTION_NOSYS_SPECS=y
CONFIG_DCACHE_ENABLE=y

# 内存配置
CONFIG_PSRAM_HEAP_SIZE=0x300000
CONFIG_HEAP_SIZE=0x10000

# 日志配置
CONFIG_EASYLOGGER_ASYNC_BUF_SIZE=102400
