# Optional venusa_rd_evb audio routing override.
CONFIG_UAC_ENABLE_BOARD_PA=y
# prj.conf stays board-neutral; use this only when the board needs fixed DMA/PA settings.
CONFIG_LISA_AUDIO_RECORD_DMA_CHN_LEFT=1
CONFIG_LISA_AUDIO_RECORD_DMA_CHN_RIGHT=2
CONFIG_LISA_AUDIO_PLAY_DMA_CHN=3
CONFIG_LISA_AUDIO_PLAY_PA_ENABLE=y
CONFIG_LISA_AUDIO_PLAY_PA_PAD=0
CONFIG_LISA_AUDIO_PLAY_PA_PIN=0
CONFIG_LISA_AUDIO_PLAY_PA_PULSE_COUNT=0
