# CherryUSB Host Audio Sample Configuration

CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

# CherryUSB 配置
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_HOST=y

# USB Host 控制器
CONFIG_CHERRYUSB_HOST_MUSB_LISA=y

# USB Audio 设备支持
CONFIG_CHERRYUSB_HOST_AUDIO=y

# 日志配置
CONFIG_LOG=y
CONFIG_SYSLOG_PRINTK_REDIRECT=y

# 系统配置
CONFIG_LINK_OPTION_NOSYS_SPECS=y

# Debug
CONFIG_BACK_TRACE=y

#heap
CONFIG_PSRAM_HEAP=y
CONFIG_PSRAM_HEAP_SIZE=0x100000
