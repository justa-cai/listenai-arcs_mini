# CherryUSB Host Video Sample Configuration

# 单核内存配置：扩展 SRAM 至 264KB，禁用不需要的 IPC / LUNA 共享区域
CONFIG_MEM_SRAM_SIZE=0x00042000
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

# CherryUSB 配置
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_HOST=y
CONFIG_HEAP_SIZE=0x3400
# USB Host 控制器
CONFIG_CHERRYUSB_HOST_MUSB_LISA=y

# USB Video 设备支持
CONFIG_CHERRYUSB_HOST_VIDEO=y

# 日志配置
CONFIG_LOG=y
CONFIG_SYSLOG_PRINTK_REDIRECT=y

# 系统配置
CONFIG_LINK_OPTION_NOSYS_SPECS=y

# Debug
CONFIG_BACK_TRACE=y

#heap
CONFIG_PSRAM_HEAP=y
CONFIG_PSRAM_HEAP_SIZE=0x500000

# GPIO / SPI / PWM（显示屏硬件）
CONFIG_LISA_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_SPI_DEVICE=y
CONFIG_LISA_SPI1=y
CONFIG_LISA_PWM=y

# 显示屏：ST7789P3 via SPI 4-wire
CONFIG_LISA_DISPLAY_DEVICE=y
CONFIG_LISA_DISPLAY_PANEL_ST7789P3=y
CONFIG_LISA_DISPLAY_BUS_SPI_4WIRE=y
CONFIG_LISA_DISPLAY_COLOR_INVERT=y
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=320
CONFIG_PANEL_ST7789P3_X_OFFSET=0

# Touch（仅用于满足 lv_port_indev.c 的编译依赖，本示例不初始化触摸）
CONFIG_LISA_TOUCH_DEVICE=y
CONFIG_LISA_TOUCH_ARCS_CST328=y
CONFIG_LISA_I2C=y
CONFIG_LISA_I2C0=y

# LVGL8
CONFIG_SDK_MODULE_LVGL8=y
CONFIG_LV_USE_SJPG=1
CONFIG_LV_DEMO_SYS_HEAP=y
CONFIG_LV_DRIVER_PIXEL_ALIGN_SIZE=16
CONFIG_LV_USE_GPU_CSK_DMA2D=y
CONFIG_LV_DOUBLE_VDB=y
CONFIG_LV_DRIVER_FULL_REFRESH=y
CONFIG_LV_DRIVER_ROTATE_270=y
CONFIG_LV_ATTRIBUTE_FAST_MEM_USE_IRAM=y

# workqueue（显示更新异步派发）
CONFIG_WORK_QUEUE=y
