# CherryUSB Host Serial Sample Configuration

# 单核内存配置：扩展 SRAM 至 264KB，禁用不需要的 IPC / LUNA 共享区域
CONFIG_MEM_SRAM_SIZE=0x00042000
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

# CherryUSB 配置
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_HOST=y

# USB Host 控制器
CONFIG_CHERRYUSB_HOST_MUSB_LISA=y

# USB Serial 设备支持
CONFIG_CHERRYUSB_HOST_CDC_ACM=y      # 标准 CDC ACM 设备 (/dev/ttyACM0)
CONFIG_CHERRYUSB_HOST_CH34X=y        # CH340/CH341 芯片 (/dev/ttyUSB0)
CONFIG_CHERRYUSB_HOST_FTDI=y         # FTDI FT232 芯片 (/dev/ttyUSB0)
CONFIG_CHERRYUSB_HOST_CP210X=y       # CP210x 芯片 (/dev/ttyUSB0)

# 日志配置
CONFIG_LOG=y

# 系统配置
CONFIG_LINK_OPTION_NOSYS_SPECS=y

# Debug
CONFIG_BACK_TRACE=y
