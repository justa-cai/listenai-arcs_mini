CONFIG_BOOT=y
CONFIG_BOOT_SECOND_STAGE=y
CONFIG_BOOT_FLASH_SIZE=0x40000

CONFIG_LISA_DEVICE=y
CONFIG_LISA_FLASH=y

# Let the app request boot recovery mode, then expose boot-side ADB as the proof path.
CONFIG_BOOT_ADB=y
CONFIG_BOOT_ADB_SHELL=y
CONFIG_BOOT_ADB_SYNC=y
CONFIG_ADB_MAX_PAYLOAD_SIZE=32768
