# Boot runs on AP core (power-on default core, same as old boot)
CONFIG_ARCS_AP_CORE=y

# Application target: boot calls AP entry directly
CONFIG_BOOT_APP_CORE_AP=y

# AP image location per partition table (ap partition at 0x040000)
CONFIG_APPLICATION_ADDRESS=0x30040000

# OTA: enable flash-based package support, disable TF card source
CONFIG_BOOT_OTA_PACKAGE=y
CONFIG_BOOT_OTA_SOURCE_TF=n

# OTA API exposed to app side for requesting updates
CONFIG_BOOT_OTA_API=y

# Recovery ADB backend: use CherryUSB for improved throughput
CONFIG_BOOT_ADB_BACKEND_CHERRYUSB=y

# arcs_mini has no SD card — disable TF/SDMMC ADB sync paths
# (default in recovery_basic/prj.conf is =y, override to =n here)
CONFIG_BOOT_ADB_SDMMC_RAW=n
CONFIG_BOOT_ADB_SDMMC_FS=n

# Stage0 power-up guard：POWER_KEY 长按 3 秒才拉起 PWR_LOCK；USB 插入
# 不自动开机。默认 port/pin/level 已对应 arcs_mini 的 PB4/PB3/PB0。
CONFIG_BOOT_POWER_GUARD=y

# Boot 指示灯 PB1（active-low），guard 期间熄灭，启动 app 时点亮。
CONFIG_BOOT_POWER_GUARD_LED=y

# 关掉 BOOT_CHECK_POWER_KEY：guard 3 秒达标后用户手指还在 PB 上，
# USB 也仍插着，此时 boot_gpio_check 瞬时采样会把 PB+USB 误判为
# 强制进 recovery。guard 本身已覆盖 PB+USB 组合的 recovery 入口。
CONFIG_BOOT_CHECK_POWER_KEY=n

# 嵌入特性标签供上层探测
CONFIG_BOOT_FEATURES=y

# Recovery-mode indicator on LCD. Override ST7789P3 defaults (170x320 @ x=35)
# with arcs_mini's actual 240x240 panel.
CONFIG_BOOT_DISPLAY=y
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=240
CONFIG_PANEL_ST7789P3_X_OFFSET=0
CONFIG_PANEL_ST7789P3_Y_OFFSET=0
