# Boot runs on AP core and jumps to the AP image in the Mini 3 partition table.
CONFIG_ARCS_AP_CORE=y
CONFIG_BOOT_APP_CORE_AP=y
CONFIG_APPLICATION_ADDRESS=0x30040000
CONFIG_BOOT_FLASH_SIZE=0x40000
CONFIG_BOOT_CONTROL_STORE_BASE_ADDR=0x3003E000

# Align Mini 3 boot features with arcs_mini: flash OTA + recovery ADB/sync +
# boot display. TF card OTA stays disabled in boot; app-side SDIO/SDMMC is
# still configured by the board pinmux.
CONFIG_BOOT_OTA_PACKAGE=y
CONFIG_BOOT_OTA_SOURCE_TF=n
CONFIG_BOOT_OTA_API=y
CONFIG_BOOT_ADB_BACKEND_CHERRYUSB=y
CONFIG_BOOT_ADB_SYNC=y

# Match arcs_mini boot: recovery ADB is enabled, but TF/SDMMC ADB paths are not.
CONFIG_BOOT_ADB_SDMMC_RAW=n
CONFIG_BOOT_ADB_SDMMC_FS=n

# Stage0 power-up guard pins:
# PB4 = POWER_KEY, PB3 = POWER_EN/PWR_LOCK, PB8 = USB_DET.
CONFIG_BOOT_POWER_GUARD=y
CONFIG_BOOT_POWER_GUARD_KEY_PORT=1
CONFIG_BOOT_POWER_GUARD_KEY_PIN=4
CONFIG_BOOT_POWER_GUARD_KEY_LEVEL=0
CONFIG_BOOT_POWER_GUARD_LATCH_PORT=1
CONFIG_BOOT_POWER_GUARD_LATCH_PIN=3
CONFIG_BOOT_POWER_GUARD_LATCH_ACTIVE_LEVEL=1
CONFIG_BOOT_POWER_GUARD_USB_PORT=1
CONFIG_BOOT_POWER_GUARD_USB_PIN=8
CONFIG_BOOT_POWER_GUARD_USB_LEVEL=1

# Mini 3 has no SoC-local guard LED; PB1 is I2C1 SCL for the external MCU.
CONFIG_BOOT_POWER_GUARD_LED=n

# Guard handles PB+USB recovery entry itself.
CONFIG_BOOT_CHECK_POWER_KEY=n

CONFIG_BOOT_FEATURES=y

# Mini 3 uses the same ST7789P3 240x240 SPI panel; real hardware matches MADCTL 0xC0.
CONFIG_BOOT_DISPLAY=y
CONFIG_BOOT_DISPLAY_MADCTL=0xC0
# POWER_KEY hint arrow: keypad-grid position 3 (top-right), pointing 3 (up-right).
CONFIG_BOOT_DISPLAY_POWER_KEY_HINT_POSITION=3
CONFIG_BOOT_DISPLAY_POWER_KEY_HINT_DIRECTION=3
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=240
CONFIG_PANEL_ST7789P3_X_OFFSET=0
CONFIG_PANEL_ST7789P3_Y_OFFSET=80
