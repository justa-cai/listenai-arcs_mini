# 系统配置
CONFIG_BACK_TRACE=y

# 内存配置
CONFIG_MODULE_HEAP=y
# arcs_evb 的 SRAM 仅 146KB，原 0x20000(128KB) 会导致 .noinit 溢出。
# 绝大多数分配走 PSRAM heap，这里只留小块用于快速路径。
CONFIG_HEAP_SIZE=0x4000
CONFIG_PSRAM_HEAP_SIZE=0x5b0000

# 日志和调试
CONFIG_LOG=y
# CONFIG_SYSLOG_PRINTK_REDIRECT=y
# CONFIG_ARCS_HAL_DEBUG=y
CONFIG_LOG_LEVEL_DEBUG=y
CONFIG_ARCS_HAL_LOG_LEVEL_INFO=y

# 项目可根据需要在此文件中设置对应的配置
# LISA Device Framework
CONFIG_LISA_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_PWM=y
CONFIG_LISA_SPI1=y

# lisa 显示屏配置（arcs_evb 默认：ST7789P3 240x320，4-wire SPI）
CONFIG_LISA_DISPLAY_DEVICE=y
CONFIG_LISA_DISPLAY_BUS_SPI_4WIRE=y
CONFIG_LISA_DISPLAY_PANEL_ST7789P3=y
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=320
CONFIG_PANEL_ST7789P3_X_OFFSET=0
CONFIG_LISA_DISPLAY_COLOR_INVERT=y

# 触摸设备配置（arcs_evb 默认：CST328 on I2C0）
CONFIG_LISA_TOUCH_DEVICE=y
CONFIG_LISA_I2C=y
CONFIG_LISA_I2C0=y
CONFIG_LISA_TOUCH_ARCS_CST328=y
# 把 CST328 读取任务的优先级提到 decoder (priority 3) 之上，
# 否则视频播放时 MJPEG/MP3 解码线程会把 touch 任务饿死，
# 导致屏幕点击事件（例如播放界面的 Stop 按钮）没有响应。
CONFIG_LISA_TOUCH_ARCS_CST328_READ_TASK_PRIORITY=5

# LVGL8 配置
CONFIG_SDK_MODULE_LVGL8=y
CONFIG_LV_DEMO_SYS_HEAP=y
CONFIG_LV_DRIVER_PIXEL_ALIGN_SIZE=16
CONFIG_LV_USE_DEMO_WIDGETS=y
CONFIG_LV_USE_GPU_CSK_DMA2D=y
CONFIG_LV_DOUBLE_VDB=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_DRIVER_FULL_REFRESH=y
CONFIG_LV_CUSTOM_MONITOR=n
CONFIG_LV_REFR_UNCONDITIONAL_AREA_JOIN=y
CONFIG_LV_DRIVER_ROTATE_270=y
# CONFIG_LV_ATTRIBUTE_FAST_MEM_USE_IRAM=y  # disabled: ILM too small with wifi+media components

# LVGL fonts
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_USE_DEMO_WIDGETS=y

# lisa SDMMC 配置
CONFIG_LISA_SDMMC_DEVICE=y
CONFIG_LISA_SDMMC_CARD_TYPE_AUTO=y

# 文件系统配置
CONFIG_FILE_SYSTEM=y
CONFIG_FATFS_FILESYSTEM=y

# DISK配置
CONFIG_DISK_DRIVER=y
CONFIG_DISK_DRIVER_SDMMC=y

# 抽象文件系统
CONFIG_LSFS=y
CONFIG_LSFS_FAT=y
CONFIG_LSFS_REGISTER_VFS=y

# 虚拟文件系统
CONFIG_LVFS=y
CONFIG_LVFS_POSIX_API=y
CONFIG_LVFS_POSIX_API_ALIAS=y

# LISA Audio Driver
CONFIG_LISA_AUDIO_DEVICE=y

# Play (DAC) - enable external PA control (some boards need this for audible output)
# CONFIG_LISA_AUDIO_PLAY_PA_ENABLE=y

# FreeRTOS 配置
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

#using mbedtls for hardware decoding(IF CONFIG_WX_SQLITE3_HARD_CODEC)
CONFIG_SDK_MODULE_MBEDTLS=y
CONFIG_CUSTOM_MBEDTLS_CFG_FILE=y
CONFIG_MBEDTLS_CFG_FILE="config-tls-generic.h"
CONFIG_MBEDTLS_HARDWARE_ENTROPY=y
# CONFIG_MBEDTLS_HARDWARE_AES=y
# CONFIG_MBEDTLS_HARDWARE_SHA1=y
# CONFIG_MBEDTLS_HARDWARE_SHA256=y
# CONFIG_MBEDTLS_HARDWARE_SHA512=y
# CONFIG_MBEDTLS_HARDWARE_AES_CCM=y
# CONFIG_MBEDTLS_HARDWARE_AES_GCM=y
# CONFIG_MBEDTLS_HARDWARE_ECC=y

# System support
CONFIG_MBEDTLS_HAVE_ASM=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_SSL_ALPN=y

# Save RAM at the expense of ROM
CONFIG_MBEDTLS_AES_ROM_TABLES=y
# mbed TLS feature support
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
# Supported TLS versions
CONFIG_MBEDTLS_TLS_VERSION_1_0=y
CONFIG_MBEDTLS_TLS_VERSION_1_1=y
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
# mbed TLS modules
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER=y
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
CONFIG_MBEDTLS_ENTROPY_ENABLED=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_MAC_MD5_ENABLED=y
CONFIG_MBEDTLS_HASH_MD5_ENABLED=y
CONFIG_MBEDTLS_MAC_SHA1_ENABLED=y
CONFIG_MBEDTLS_HASH_SHA1_ENABLED=y
CONFIG_MBEDTLS_MAC_SHA256_ENABLED=y
CONFIG_MBEDTLS_SHA256_SMALLER=y
CONFIG_MBEDTLS_HASH_SHA256_ENABLED=y
CONFIG_MBEDTLS_DTLS=y
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_MAC_SHA512_ENABLED=y
CONFIG_MBEDTLS_HASH_SHA512_ENABLED=y
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y

# CONFIG_MBEDTLS_DEBUG=y

CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

# LISA WIFI
#
# 注：前期调查一度怀疑 arcs_evb 板 wifi 在启动早期挂死（0 字节串口、
# 连 SDK banner 都没出），后来定位到是 cskburn 用了错的 reset 策略
# （需要 `--reset-strategy cross-coupled` 对应 Q1/Q2 交叉耦合复位电路）。
# 用对 reset 策略后，wifi 栈在 arcs_evb 上完全正常（扫描到 AP、shell
# 正常）。完整分析见 branch fix/macos-build-link-slow 的调试记录。
CONFIG_LISA_WIFI=y
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y
CONFIG_WIFI_MANAGER=y
CONFIG_LWIP=y
CONFIG_WIFI=y
CONFIG_WIFI_TX_BUF_COPY=y
CONFIG_WIFI_LWIP_SAME_CORE=y
CONFIG_LWIP_TX_BUF_COPY=y
CONFIG_LWIP_OPTION_LWIP_DNS=y
CONFIG_LWIP_OPTION_SO_REUSE=y
CONFIG_MODULE_ZE_TLS=y
CONFIG_MODULE_HTTPCLIENT=y
CONFIG_MODULE_NOPOLL=y
CONFIG_MODULE_CORESNTP=y

# 使能 libjpeg-turbo
CONFIG_SDK_MODULE_LIBJPEG_TURBO=y
CONFIG_LISA_JPEG=y

# Use global component instead of sample-local sources
CONFIG_LISA_MEDIA_PLAYER=y
CONFIG_SDK_MODULE_LVGL8=y
CONFIG_AVI_PLAYER_LVGL_RENDER=y


# Enable MP3 audio in AVI (WAVE_FORMAT_MPEGLAYER3=0x0055)
CONFIG_AVI_PLAYER_AUDIO_MP3=y

# MP3 decode resources (tune if needed)
CONFIG_AVI_PLAYER_MP3_DECODE_QUEUE_DEPTH=8
CONFIG_AVI_PLAYER_MP3_DECODE_THREAD_STACK_SIZE=12288
CONFIG_AVI_PLAYER_MP3_DECODE_THREAD_PRIORITY=3

# HTTP Range streaming (needed for online playback)
CONFIG_AVI_PLAYER_HTTP_RANGE=y
CONFIG_AVI_PLAYER_WIFI_CONNECT_TIMEOUT_S=30

CONFIG_AVI_PLAYER_PROFILE_LOG=y
CONFIG_AVI_PLAYER_MAX_VIDEO_AHEAD_MS=500
CONFIG_AVI_PLAYER_MJPEG_DECODE_THREAD_PRIORITY=3

# lisa_jpeg hw decoder tuning for av_render (reduce timeout-retry jitter)
CONFIG_LISA_JPEG_DECODER_RGB565_ONLY=y
CONFIG_LISA_JPEG_DECODER_WAIT_TIMEOUT_US=45000
CONFIG_LISA_JPEG_DECODE_GPDMA_IN_CH=5
CONFIG_LISA_JPEG_DECODE_GPDMA_OUT_CH=4
CONFIG_AVI_PLAYER_LISA_JPEG_SOFT_FALLBACK=y

# TinyUSB 配置
CONFIG_TINY_USB=y
CONFIG_TINY_USB_USE_CUSTOM_CONFIG_FILE=y
CONFIG_TINY_USB_CONFIG_FILE="tusb_config.h"

# 系统配置
CONFIG_LINK_OPTION_NOSYS_SPECS=y

CONFIG_LISA_QSPILCD_GPDMA_CH=1

CONFIG_LISA_AUDIO_RECORD_MIC0_ENABLE=n
CONFIG_LISA_AUDIO_RECORD_MIC1_ENABLE=n
CONFIG_AVI_PLAYER_STATS_LOG=y

CONFIG_AVI_PLAYER_FIXED_FPS=y
CONFIG_AVI_PLAYER_FIXED_FPS_VALUE=20

# Adaptive FPS: reduce video pressure when decode/push cost remains high
CONFIG_AVI_PLAYER_ADAPTIVE_DECODE_SLOW_FPS=y
CONFIG_AVI_PLAYER_ADAPTIVE_DECODE_SLOW_FPS_MIN=12
CONFIG_AVI_PLAYER_ADAPTIVE_DECODE_SLOW_FPS_STEP=2
CONFIG_AVI_PLAYER_ADAPTIVE_DECODE_SLOW_WINDOW_FRAMES=16
CONFIG_AVI_PLAYER_ADAPTIVE_DECODE_SLOW_DOWN_MS=45
CONFIG_AVI_PLAYER_ADAPTIVE_DECODE_SLOW_UP_MS=32

CONFIG_AVI_PLAYER_VIDEO_DECODER_MJPEG=y