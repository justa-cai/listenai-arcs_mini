# 基础配置
CONFIG_LISA_DEVICE=y

CONFIG_HEAP_SIZE=0xC000
CONFIG_PSRAM_HEAP_SIZE=0x200000

# 音频驱动配置
CONFIG_LISA_AUDIO_DEVICE=y
CONFIG_LISA_AUDIO_PLAY_ECHO_ENABLE=y

# 蓝牙音频框架配置
CONFIG_LISA_BT_AUDIO_FRAMEWORK=y
CONFIG_LISA_BT_AUDIO_INTERFACE=y
CONFIG_LISA_BT_AUDIO_INTERFACE_LOCAL=y
CONFIG_LISA_BT_AUDIO_MAX_SESSIONS=4

# 基于时间的缓冲区配置（动态计算大小）
# 工作缓冲区时间：64ms
CONFIG_LISA_BT_AUDIO_WORK_BUFFER_TIME_MS=64

# 硬件 DMA 缓冲区数量
CONFIG_LISA_BT_AUDIO_HW_BUFFER_COUNT=3

# PCM环形缓冲区时间：200ms
CONFIG_LISA_BT_AUDIO_PCM_RINGBUF_TIME_MS_DOWNLINK=200
CONFIG_LISA_BT_AUDIO_PCM_RINGBUF_TIME_MS_UPLINK=200

# PCM预填充时间：60ms（防止初始播放卡顿）
CONFIG_LISA_BT_AUDIO_PCM_PREFILL_TIME_MS=60

# 编码数据缓冲区配置（固定大小，因为编码数据大小取决于codec类型）
CONFIG_LISA_BT_AUDIO_ENCODED_RINGBUF_SIZE=2

# 线程配置
CONFIG_LISA_BT_AUDIO_DECODE_TASK_STACK_SIZE=2048
CONFIG_LISA_BT_AUDIO_DECODE_TASK_PRIORITY=9
CONFIG_LISA_BT_AUDIO_PLAYBACK_TASK_STACK_SIZE=2048
CONFIG_LISA_BT_AUDIO_PLAYBACK_TASK_PRIORITY=10
CONFIG_LISA_BT_AUDIO_ENCODE_TASK_STACK_SIZE=2048
CONFIG_LISA_BT_AUDIO_ENCODE_TASK_PRIORITY=9

# 音频编解码器
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_CODEC_MSBC=y

CONFIG_LISA_BT_AUDIO_ADAPTER=n
CONFIG_BACK_TRACE=y
CONFIG_RINGBUF=y
