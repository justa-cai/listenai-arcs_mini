CONFIG_LOG_FRONTEND_EASYLOGGER=y

# The BLE controller+host stack runs on the CP core (matches the C BLE samples).
CONFIG_ARCS_CP_CORE=y

# Flash + NVS back the persistent BD address / pairing storage.
CONFIG_ARCS_HAL_FLASH_IF=y
CONFIG_ARCS_HAL_NVS=y

# LISA Bluetooth, BLE capability, advertised device name.
CONFIG_LISA_BLUETOOTH=y
CONFIG_LISA_BLUETOOTH_BLE=y
CONFIG_LISA_BLUETOOTH_DEVICE_NAME="Rust-ARCS"
