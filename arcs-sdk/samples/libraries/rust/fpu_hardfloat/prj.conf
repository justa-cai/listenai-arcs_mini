CONFIG_LOG_FRONTEND_EASYLOGGER=y

# Run on the AP core (hartid 0): it owns the hardware FPU (misa.F=1); the
# default CP core (hartid 1) has none. ARCS_AP_CORE auto-sets CONFIG_HARTID=0.
CONFIG_ARCS_AP_CORE=y

# Embed the bootloader and call the app directly on the AP core (single
# self-contained image at 0x0; not auto-on for AP, default routing jumps to CP).
CONFIG_BOOT=y
CONFIG_BOOT_APP_CORE_AP=y

# Full hard-float: build the whole image rv32imafc / ilp32f (ARCS_AP_CORE
# already `imply FPU`; set it explicitly for clarity). CONFIG_RISCV_FPU makes
# the FreeRTOS port save/restore the F registers per task, so C and Rust can
# both use FP safely. Rust must match the ilp32f ABI — the sample's
# .cargo/config.toml targets riscv32imafc + build-std (nightly).
CONFIG_FPU=y
CONFIG_RISCV_FPU=y
