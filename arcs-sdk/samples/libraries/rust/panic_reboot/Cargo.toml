[package]
name    = "rust_panic_reboot"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["staticlib"]
path       = "src/lib.rs"

[dependencies]
arcs = { version = "0.1.0", features = ["panic-reboot"] }
log  = { version = "0.4", default-features = false }
