CONFIG_LOG_FRONTEND_EASYLOGGER=y

# Display bring-up on arcs_evb (ST7789P3 over SPI1 4-wire, PWM0 backlight).
CONFIG_LISA_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_PWM=y
CONFIG_LISA_SPI1=y
CONFIG_LISA_DISPLAY_DEVICE=y
CONFIG_LISA_DISPLAY_PANEL_ST7789P3=y
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=320
CONFIG_PANEL_ST7789P3_X_OFFSET=0
CONFIG_LISA_DISPLAY_BUS_SPI_4WIRE=y

# Framebuffer (240x320x2 ~ 150 KiB) is allocated in PSRAM via arcs::Zone::Psram,
# so the PSRAM heap must be large enough (default 0x20000 is too small).
CONFIG_PSRAM_HEAP_SIZE=0x3b0000
