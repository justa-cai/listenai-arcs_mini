CONFIG_LOG_FRONTEND_EASYLOGGER=y

# wifi_manager allocates from PSRAM (MALLOC_CAP_SPIRAM), so PSRAM heap is
# mandatory; the default heap holds the LWIP/wifi task stacks.
CONFIG_HEAP_SIZE=0xC000
CONFIG_PSRAM_HEAP_SIZE=0x200000

# WiFi stack (LS26xx SoC). SAME_CORE => wifi + lwip on the app core; it
# auto-selects CONFIG_WIFI + CONFIG_LWIP.
CONFIG_LISA_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y

# MAC source: derive from chip-id efuse (no filesystem / KV needed). The
# lisa_wifi bring-up requires a custom_mac callback (see src/main.c).
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y

# Station scan/connect API.
CONFIG_WIFI_MANAGER=y

# wifi_manager link-depends on lisa_kv; use the flash-backed EasyFlash backend
# so we avoid the whole FATFS/SDMMC/LSFS filesystem stack (scan needs no
# persistent AP storage).
CONFIG_LISA_KV_TYPE_EF=y
CONFIG_LISA_FLASH=y

CONFIG_LISA_PORTING=y
CONFIG_LISA_OS=y
