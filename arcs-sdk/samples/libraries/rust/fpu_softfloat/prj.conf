# Pure software floating-point: the SDK stays soft-float (rv32imac / ilp32) and
# the Rust f32 math lowers to soft-float libcalls, so this runs on the default
# core with no FPU and no special boot/ABI config (just like blinky). The
# hardware-FPU counterpart lives in the fpu_hardfloat sample.
CONFIG_LOG_FRONTEND_EASYLOGGER=y
