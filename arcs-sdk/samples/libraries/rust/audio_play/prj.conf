CONFIG_LOG_FRONTEND_EASYLOGGER=y

# Single-core memory layout: grow SRAM, drop IPC / LUNA shared regions
# (matches the C/Zig audio playback samples).
CONFIG_MEM_SRAM_SIZE=0x00038000
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

# LISA device framework + audio (DAC) driver -> registers "audio0".
CONFIG_LISA_DEVICE=y
CONFIG_LISA_AUDIO_DEVICE=y

# The driver allocates its DMA buffer pool from the PSRAM heap, and the Rust
# sample puts its PCM working buffer there too (arcs::Zone::Psram, R5).
CONFIG_HEAP_SIZE=0x20000
CONFIG_PSRAM_HEAP_SIZE=0x80000

# To drive the on-board speaker amplifier instead of line-out, enable the PA:
#   CONFIG_LISA_AUDIO_PLAY_PA_ENABLE=y
#   CONFIG_LISA_AUDIO_PLAY_PA_PIN=27
