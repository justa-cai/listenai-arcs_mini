CONFIG_HEAP_SIZE=0xC000
CONFIG_PSRAM_HEAP_SIZE=0x200000

CONFIG_LOG=y
CONFIG_PRINTF_LOG_REDIRECT=y

# WiFi (底层, 无 WiFi Manager)
CONFIG_LISA_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y

# MAC Manager
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y

# Platform
CONFIG_LISA_PORTING=y
CONFIG_LISA_OS=y
CONFIG_LISA_DEVICE=y
