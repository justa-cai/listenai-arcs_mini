# 单核内存配置：扩展 SRAM 至 224KB，禁用不需要的 IPC / LUNA 共享区域
CONFIG_MEM_SRAM_SIZE=0x00038000
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

# LISA Device Framework
CONFIG_LISA_DEVICE=y

# LISA Audio Driver
CONFIG_LISA_AUDIO_DEVICE=y
CONFIG_LISA_AUDIO_PLAY_ECHO_ENABLE=y

# ARCS_MINI: PA GPIO
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y

CONFIG_HEAP_SIZE=0x30000
CONFIG_PSRAM_HEAP_SIZE=0x100000

# 日志和调试
CONFIG_LOG_LEVEL_DEBUG=y
CONFIG_ARCS_HAL_LOG_LEVEL_DEBUG=y
CONFIG_BACK_TRACE=y
