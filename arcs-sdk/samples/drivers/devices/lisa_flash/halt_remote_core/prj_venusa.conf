# ============================================
# LISA Flash VenusA Dual-Core Hook Sample - CP
# CP runs flash erase/write/read operations.
# ============================================

# VenusA CP core image (hart 1)
CONFIG_HARTID=1
CONFIG_BOOT=n
CONFIG_CLOCK_INIT=n
CONFIG_PSRAM_INIT=n

# LISA Flash driver with VenusA ic_message hooks.
# CP must not re-initialize shared clock/PSRAM after AP has booted.
CONFIG_LISA_DEVICE=y
CONFIG_LISA_FLASH=y
CONFIG_LISA_FLASH_HALT_REMOTE_CORE=y

# CP image starts at AP image + 0x80000.
CONFIG_MEM_FLASH_BASE=0x30080000
CONFIG_MEM_FLASH_SIZE=0x00F80000

# Split VenusA RAM explicitly for this two-image sample.
CONFIG_MEM_SRAM_BASE=0x20016000
CONFIG_MEM_SRAM_SIZE=0x0000A000
CONFIG_MEM_PSRAM_BASE=0x38400000
CONFIG_MEM_PSRAM_SIZE=0x00400000
CONFIG_MEM_APRAM_BASE=0x20040000
CONFIG_MEM_APRAM_SIZE=0x00040000

CONFIG_MAIN_TASK_STACK_SIZE=3072
CONFIG_HEAP_SIZE=0x2000
CONFIG_LOG_MODE_ASYNC=n
CONFIG_EASYLOGGER_LOG_MODE_ASYNC=n
