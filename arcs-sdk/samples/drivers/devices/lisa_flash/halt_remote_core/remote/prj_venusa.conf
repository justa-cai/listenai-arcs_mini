# ============================================
# LISA Flash VenusA Dual-Core Hook Sample - AP
# AP receives flash hook messages and waits in SRAM.
# ============================================

# VenusA AP core image (hart 0)
CONFIG_HARTID=0

# Build the VenusA flash hook receiver into the AP image.
CONFIG_LISA_DEVICE=y
CONFIG_LISA_FLASH=y
CONFIG_LISA_FLASH_HALT_REMOTE_CORE=y
CONFIG_LISA_FLASH_HOOK_WAITER_ONLY=y

# AP image is burned at flash base 0x30000000.
CONFIG_MEM_FLASH_BASE=0x30000000
CONFIG_MEM_FLASH_SIZE=0x00080000

# Split VenusA RAM explicitly for this two-image sample.
CONFIG_MEM_SRAM_BASE=0x20009000
CONFIG_MEM_SRAM_SIZE=0x0000D000
CONFIG_MEM_PSRAM_BASE=0x38000000
CONFIG_MEM_PSRAM_SIZE=0x00400000
CONFIG_MEM_APRAM_BASE=0x20040000
CONFIG_MEM_APRAM_SIZE=0x00040000

CONFIG_CONSOLE_UART_NAME="uart1"
CONFIG_MAIN_TASK_STACK_SIZE=3072
CONFIG_HEAP_SIZE=0x2000
CONFIG_LOG_MODE_ASYNC=n
CONFIG_EASYLOGGER_LOG_MODE_ASYNC=n
