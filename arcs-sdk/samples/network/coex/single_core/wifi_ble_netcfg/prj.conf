CONFIG_RTOS_AL=y

CONFIG_ARCS_CP_CORE=y
CONFIG_ARCS_HAL_WCND=y
CONFIG_ARCS_HAL_FLASH_IF=y
CONFIG_ARCS_HAL_NVS=y

CONFIG_HEAP_SIZE=0x10000
CONFIG_PSRAM_HEAP_SIZE=0x200000

CONFIG_LISA_PORTING=y
CONFIG_LISA_OS=y

CONFIG_LISA_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y
CONFIG_WIFI_MANAGER=y

CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y

# File system (required by WIFI_MANAGER -> LISA_KV -> LSFS -> disk -> fs_env)
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_DRIVER=y
CONFIG_LSFS=y

# Lisa Bluetooth
CONFIG_LISA_BLUETOOTH=y
CONFIG_LISA_BLUETOOTH_BLE=y
CONFIG_LISA_BLUETOOTH_BLE_NETCFG=y
