CONFIG_LISA_DEVICE=y

CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y

CONFIG_LISA_I2C=y
CONFIG_LISA_I2C0=y

CONFIG_LISA_CAMERA_DEVICE=y
CONFIG_LISA_CAMERA_BUS_DVP=y
CONFIG_LISA_CAMERA_SENSOR_GC032A=y
CONFIG_LISA_CAMERA_SENSOR_GC0328=y

# LISA Audio Driver
CONFIG_LISA_AUDIO_DEVICE=y

CONFIG_SDK_MODULE_LIBJPEG_TURBO=y

# Heap configuration
CONFIG_HEAP_SIZE=0x3000
CONFIG_PSRAM_HEAP_SIZE=0x5b0000

# DISK驱动使能
CONFIG_DISK_DRIVER=y

# 文件系统配置
CONFIG_FILE_SYSTEM=y
CONFIG_FATFS_FILESYSTEM=y
CONFIG_LSFS=y
CONFIG_LSFS_FAT=y
CONFIG_LSFS_REGISTER_VFS=y
CONFIG_LVFS_POSIX_API_ALIAS=y
CONFIG_LVFS=y
CONFIG_LVFS_POSIX_API=y
CONFIG_FS_ENV_MEMORY_MANAGEMENT_USE_PSRAM=y

# SD Card drivers
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_LISA_SDMMC_DEVICE=y

# Micro RTSP-C Module
CONFIG_SDK_MODULE_MICRO_RTSP_C=y

# Logging
CONFIG_EASYLOGGER_ASYNC_BUF_SIZE=0x1000

# LISA Porting
CONFIG_LISA_PORTING=y
CONFIG_LISA_OS=y
CONFIG_LISA_KV=y
CONFIG_LISA_NETWORK=y

# LISA WIFI
CONFIG_LISA_WIFI=y

# MAC Manager
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y

# Network Configuration
CONFIG_LWIP=y
CONFIG_WIFI=y
CONFIG_WIFI_TX_BUF_COPY=y
CONFIG_WIFI_LWIP_SAME_CORE=y
CONFIG_LWIP_TX_BUF_COPY=y
CONFIG_LWIP_OPTION_LWIP_DNS=y
CONFIG_LWIP_OPTION_SO_REUSE=y

# WiFi RAM: 192KB (0x30000) - 彻底解决NET_TX_BUF_CNT=45时的溢出
# 通过 CONFIG_MEM_CONFIG 启用自定义内存配置，调整 SRAM 基地址避免重叠
CONFIG_MEM_WFRAM_SIZE=0x30000

# 启用自定义内存配置
CONFIG_MEM_CONFIG=y
# SRAM从192KB WiFi RAM之后开始
CONFIG_MEM_SRAM_BASE=0x20030000
# SRAM结束地址必须小于 0x20040000 (IPC RAM)
# WFRAM 160KB: 0x20000000 - 0x20028000
# SRAM Start: 0x20028000, Max End: 0x20040000
# SRAM Size = 0x18000 (96KB)

CONFIG_MEM_WFRAM_SIZE=0x28000
CONFIG_MEM_SRAM_BASE=0x20028000
CONFIG_MEM_SRAM_SIZE=0x18000

CONFIG_DCACHE_ENABLE=y

# WIFI MANAGER
CONFIG_WIFI_MANAGER=y

# LISA Shell
CONFIG_LISA_SHELL=y

CONFIG_CJSON=y
CONFIG_BACK_TRACE=y

CONFIG_ARCS_HAL_LS_JPEG=y
CONFIG_LISA_UART_DEVICE=y
CONFIG_LISA_UART_ASYNC_API=y
CONFIG_LISA_UART1=y