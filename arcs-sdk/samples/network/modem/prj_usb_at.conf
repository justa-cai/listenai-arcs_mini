# USB AT backend overlay for samples/network/modem

# Single-core memory layout for CherryUSB host modem sample.
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

CONFIG_SAMPLE_MODEM_BACKEND_UART=n
CONFIG_SAMPLE_MODEM_BACKEND_USB_AT=y

CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_HOST=y
CONFIG_CHERRYUSB_HOST_MUSB_LISA=y
CONFIG_CHERRYUSB_HOST_CDC_ECM=y
CONFIG_CHERRYUSB_HOST_GSM=y
# Keep ECM interface support enabled, but do not bind it into lwIP.
CONFIG_CHERRYUSB_HOST_CDC_ECM_NETIF=n
