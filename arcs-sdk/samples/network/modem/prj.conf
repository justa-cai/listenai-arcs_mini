# 项目可根据需要在此文件中设置对应的配置
CONFIG_ARCS_HAL_WARNING_DISABLE=y
CONFIG_SDK_MODULE_EASYLOGGER=n

CONFIG_MODULE_FREERTOS=y
CONFIG_MODULE_HEAP=y
CONFIG_LINK_OPTION_NOSYS_SPECS=y

CONFIG_EASYLOGGER_ASYNC_BUF_SIZE=0x1000

# DISK 驱动使能
CONFIG_DISK_DRIVER=y

# 日志配置
CONFIG_LOG=y

# FreeRTOS 配置
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

# 缓存配置
CONFIG_DCACHE_ENABLE=y

# 堆内存配置
CONFIG_PSRAM_INIT=y
CONFIG_HEAP_SIZE=0xC000
CONFIG_PSRAM_HEAP_SIZE=0x200000

# 文件系统配置
CONFIG_FILE_SYSTEM=y
CONFIG_FATFS_FILESYSTEM=y
CONFIG_LSFS=y
CONFIG_LSFS_FAT=y
CONFIG_LSFS_REGISTER_VFS=y
CONFIG_LVFS_POSIX_API_ALIAS=y
CONFIG_LVFS=y
CONFIG_LVFS_POSIX_API=y
CONFIG_FS_ENV_MEMORY_MANAGEMENT_USE_PSRAM=y

# SD Card 驱动
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_LISA_SDMMC_DEVICE=y

# LISA 组件
CONFIG_LISA_OS=y
CONFIG_LISA_KV=y
CONFIG_LISA_PORTING=y
CONFIG_LISA_NETWORK=y
CONFIG_WORK_QUEUE=y

# 调试配置
CONFIG_BACK_TRACE=y

# LISA Shell
CONFIG_LISA_SHELL=y

# UART 驱动（4G 模块通信必需）
CONFIG_LISA_UART_DEVICE=y
CONFIG_LISA_UART2=y
CONFIG_LISA_UART_ASYNC_API=y

# 4G Modem 配置（重要）
CONFIG_LISA_MODEM=y

# SAL 网络抽象层
CONFIG_SAL_USING_POSIX=y
CONFIG_LISA_NET=y


# LWIP 网络栈（Modem 使用 SAL 抽象层）
CONFIG_LWIP=y
CONFIG_LWIP_OPTION_LWIP_DNS=y
CONFIG_LWIP_OPTION_SO_REUSE=y

# 禁用不需要的模块
CONFIG_SDK_MODULE_LISA_PLAYER=n
