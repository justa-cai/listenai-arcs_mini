# Minimal EC801E USB AT 4G HTTP downlink speed test.

CONFIG_ARCS_HAL_WARNING_DISABLE=y
CONFIG_SDK_MODULE_EASYLOGGER=n

CONFIG_MODULE_FREERTOS=y
CONFIG_MODULE_HEAP=y
CONFIG_LINK_OPTION_NOSYS_SPECS=y
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

CONFIG_LOG=y
CONFIG_BACK_TRACE=y

CONFIG_DCACHE_ENABLE=y
CONFIG_PSRAM_INIT=y
CONFIG_HEAP_SIZE=0xC000
CONFIG_PSRAM_HEAP_SIZE=0x200000

# Single-core memory layout for CherryUSB host modem sample.
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_LUNA_SHARED_SIZE=0x0

CONFIG_LISA_OS=y
CONFIG_WORK_QUEUE=y

# EC801E 4G modem through USB CDC AT interface.
CONFIG_LISA_MODEM=y
CONFIG_LISA_MODEM_DRIVER_EC801E=y
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_HOST=y
CONFIG_CHERRYUSB_HOST_MUSB_LISA=y
CONFIG_CHERRYUSB_HOST_CDC_ECM=y
CONFIG_CHERRYUSB_HOST_GSM=y
CONFIG_CHERRYUSB_HOST_CDC_ECM_NETIF=n
CONFIG_USBHOST_SERIAL_RX_SIZE=8192

# lwIP headers/types are used by the modem socket-style API.
CONFIG_LWIP=y
CONFIG_LWIP_OPTION_LWIP_DNS=y
CONFIG_LWIP_OPTION_SO_REUSE=y
CONFIG_SAL_USING_POSIX=y
CONFIG_LISA_NET=y

CONFIG_SDK_MODULE_LISA_PLAYER=n
