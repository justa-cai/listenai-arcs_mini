# 使用自定义内存配置文件和自定义链接脚本
CONFIG_MEM_CONFIG=n
CONFIG_MEM_FLASH_BASE=0x308D0000
CONFIG_MEM_FLASH_SIZE=0x0072D000
CONFIG_MEM_PSRAM_BASE=0x28800000
CONFIG_MEM_PSRAM_SIZE=0x00800000
CONFIG_MEM_SRAM_BASE=0x20010000
CONFIG_MEM_SRAM_SIZE=0x00024800

# CP core
CONFIG_ARCS_CP_CORE=y

# not boot loader
CONFIG_BOOT_HART=n
CONFIG_BOOT=n

# C LIB
CONFIG_LINK_OPTION_NONE_SPECS=y

# HEAP
CONFIG_HEAP_SIZE=0x3AD0
CONFIG_PSRAM_HEAP_SIZE=0x700000

# CPP
CONFIG_LINK_CPP_RUNTIME_SECTIONS=n
CONFIG_CPP_EXCEPTIONS=n

# Debug
CONFIG_BACK_TRACE=y

# freertos
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

# main task
CONFIG_MAIN_TASK_STACK_SIZE=8192
CONFIG_MAIN_TASK_PRIORITY=5

# IPC
CONFIG_ARCS_HAL_LSF=y
CONFIG_IPC_LSF=y
CONFIG_DISK_MEM=y
CONFIG_DISK_MEM_SERVER=y
CONFIG_DISK_DRIVER=y
CONFIG_DISK_DRIVER_SDMMC=y

# GPDMA
CONFIG_ARCS_GPDMA_FULL_INIT=y

# Device
CONFIG_LISA_DEVICE=y
CONFIG_LISA_SDMMC_DEVICE=y

# acomp cv
CONFIG_ACOMP=y
CONFIG_ACOMP_CV=y
CONFIG_ACOMP_RESMGR=y
CONFIG_ACOMP_CV_RES_CUTLINE_EMMC_ADDR=0x9B00000
CONFIG_ACOMP_CV_RES_CUTLINE_SIZE=461952
CONFIG_ACOMP_CV_RES_OCR_EMMC_ADDR=0xA000000
CONFIG_ACOMP_CV_RES_OCR_SIZE=4586672

# watchdog
CONFIG_BOOT_WITH_WATCHDOG=y
CONFIG_WATCHDOG_ENABLE=n
