CONFIG_MEM_FLASH_BASE=0x308D0000
CONFIG_MEM_FLASH_SIZE=0x0072D000
CONFIG_MEM_PSRAM_BASE=0x28800000
CONFIG_MEM_PSRAM_SIZE=0x00800000
CONFIG_MEM_SRAM_BASE=0x20010000
CONFIG_MEM_SRAM_SIZE=0x00024800
CONFIG_HEAP_SIZE=0x3AD0

# CP core
CONFIG_ARCS_CP_CORE=y

# not boot loader
CONFIG_BOOT_HART=n
CONFIG_BOOT=n

# C LIB
CONFIG_LINK_OPTION_NONE_SPECS=y

# HEAP
CONFIG_PSRAM_HEAP_SIZE=0x7D8000

# CPP
CONFIG_LINK_CPP_RUNTIME_SECTIONS=n
CONFIG_CPP_EXCEPTIONS=n

# Debug
CONFIG_BACK_TRACE=y

# freertos
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

# main task
CONFIG_MAIN_TASK_STACK_SIZE=8192
CONFIG_MAIN_TASK_PRIORITY=5

# IPC
CONFIG_ARCS_HAL_LSF=y
CONFIG_IPC_LSF=y
CONFIG_DISK_MEM=y
CONFIG_DISK_MEM_SERVER=y
CONFIG_DISK_DRIVER=y
CONFIG_DISK_DRIVER_SDMMC=y

# GPDMA
CONFIG_ARCS_GPDMA_FULL_INIT=y

# Audio
CONFIG_LISA_DEVICE=y
CONFIG_LISA_AUDIO_DEVICE=y
CONFIG_LISA_SDMMC_DEVICE=y

# acomp xtts
CONFIG_ACOMP=y
CONFIG_ACOMP_XTTS=y
CONFIG_ACOMP_RESMGR=y
CONFIG_ACOMP_XTTS_RES_CNCN_DICT_EMMC_ADDR=0x5F00000
CONFIG_ACOMP_XTTS_RES_CNCN_DICT_SIZE=3166858
CONFIG_ACOMP_XTTS_RES_ENUS_DICT_EMMC_ADDR=0x6400000
CONFIG_ACOMP_XTTS_RES_ENUS_DICT_SIZE=2470275
CONFIG_ACOMP_XTTS_RES_CRF_EMMC_ADDR=0x6900000
CONFIG_ACOMP_XTTS_RES_CRF_SIZE=7791842
CONFIG_ACOMP_XTTS_RES_FRONT_USER_EMMC_ADDR=0x5A00000
CONFIG_ACOMP_XTTS_RES_FRONT_USER_SIZE=3082688
CONFIG_ACOMP_XTTS_RES_REAR_EMMC_ADDR=0x7D00000
CONFIG_ACOMP_XTTS_RES_REAR_SIZE=4273824
CONFIG_ACOMP_XTTS_RES_REAR_NHV_EMMC_ADDR=0x8200000
CONFIG_ACOMP_XTTS_RES_REAR_NHV_SIZE=284992

# watchdog
CONFIG_BOOT_WITH_WATCHDOG=y
CONFIG_WATCHDOG_ENABLE=n
