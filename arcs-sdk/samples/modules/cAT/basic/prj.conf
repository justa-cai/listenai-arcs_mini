# cAT AT Command Parser - Basic Example Configuration
CONFIG_BOARD_ARCS_EVB=y
CONFIG_LISA_DEVICE=y
CONFIG_LISA_UART_DEVICE=y
CONFIG_LISA_UART1=y

# Enable cAT module
CONFIG_SDK_MODULE_CAT=y
CONFIG_SDK_MODULE_CAT_UNSOLICITED_BUFFER_SIZE=4

# Enable UART adapter
CONFIG_SDK_MODULE_CAT_UART_DEVICE="uart1"
CONFIG_SDK_MODULE_CAT_UART_BAUDRATE=115200
CONFIG_SDK_MODULE_CAT_TASK_STACK_SIZE=2048
CONFIG_SDK_MODULE_CAT_TASK_PRIORITY=5

# Custom config items used by the example code
CONFIG_CAT_UART_DEVICE_NAME="uart1"
CONFIG_CAT_UART_BAUDRATE=115200
CONFIG_CAT_UART_RX_BUFFER_SIZE=256
CONFIG_CAT_UART_TX_BUFFER_SIZE=256

# Enable RTOS for background task
CONFIG_MODULE_FREERTOS=y

# Enable logging
CONFIG_SDK_DRIVER_LOG=y
