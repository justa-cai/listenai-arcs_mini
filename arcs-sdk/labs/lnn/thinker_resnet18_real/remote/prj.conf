# AP Core: Thinker runtime and ResNet18 inference.
CONFIG_MEM_CONFIG=y
CONFIG_MEM_SRAM_BASE=0x20010000
CONFIG_MEM_SRAM_SIZE=0x00020000
CONFIG_MEM_PSRAM_BASE=0x28000000
CONFIG_MEM_PSRAM_SIZE=0x00700000
CONFIG_MEM_FLASH_BASE=0x30000000
CONFIG_MEM_FLASH_SIZE=0x00200000
CONFIG_MEM_LUNA_SHARED_SIZE=0x00005000
CONFIG_MEM_IPC_BASE=0x2004D000
CONFIG_MEM_IPC_SIZE=0x00003000
CONFIG_MEM_APRAM_BASE=0x20051000
CONFIG_MEM_APRAM_SIZE=0x0005F000

CONFIG_ARCS_AP_CORE=y
CONFIG_CLOCK_INIT=y
CONFIG_PSRAM_INIT=y
CONFIG_ARCS_HAL_IPC=y
CONFIG_ARCS_HAL_IPC_SLAVE=y
CONFIG_ARCS_HAL_IPC_MRPC_SERVER=n
CONFIG_ARCS_HAL_IPC_MRPC_CLIENT=n
CONFIG_ARCS_HAL_IPC_PRINT=y
CONFIG_ARCS_HAL_LSF=n
CONFIG_IPC_LSF=n
CONFIG_LSF_SERVER=n
CONFIG_DISK_MEM=n
CONFIG_DISK_MEM_CLIENT=n
CONFIG_DISK_MEM_SERVER=n

CONFIG_LOG=y
CONFIG_PRINTF_LOG_REDIRECT=y
CONFIG_BACK_TRACE=y

CONFIG_HEAP_SIZE=0x10000
CONFIG_PSRAM_HEAP_SIZE=0x100000
CONFIG_MAIN_TASK_STACK_SIZE=8192
CONFIG_MAIN_TASK_PRIORITY=1
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

CONFIG_THINKER_LIB=y
CONFIG_THINKER_RESNET18_REAL_MODEL_ADDR=0x30500000
CONFIG_THINKER_RESNET18_REAL_MODEL_SIZE=0x1FD1E0
CONFIG_THINKER_RESNET18_REAL_PSRAM_POOL_SIZE=0x10000
CONFIG_THINKER_RESNET18_REAL_SHARE_POOL_SIZE=0x58000
CONFIG_THINKER_RESNET18_REAL_CP_FLASH_BASE=0x30200000
