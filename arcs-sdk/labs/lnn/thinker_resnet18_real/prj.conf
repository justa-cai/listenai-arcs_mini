# CP Core: camera capture, LVGL preview and touch UI.
CONFIG_MEM_CONFIG=y
CONFIG_MEM_SRAM_BASE=0x20030000
CONFIG_MEM_SRAM_SIZE=0x00010000
CONFIG_MEM_PSRAM_BASE=0x28130000
CONFIG_MEM_PSRAM_SIZE=0x00460000
CONFIG_MEM_FLASH_BASE=0x30200000
CONFIG_MEM_FLASH_SIZE=0x00300000
CONFIG_MEM_LUNA_SHARED_SIZE=0x00005000
CONFIG_MEM_IPC_BASE=0x2004D000
CONFIG_MEM_IPC_SIZE=0x00003000
CONFIG_MEM_APRAM_BASE=0x20051000
CONFIG_MEM_APRAM_SIZE=0x0005F000
CONFIG_MEM_INTERRUPT_STACK_SIZE=0x0E00

CONFIG_ARCS_CP_CORE=y
CONFIG_BOOT=n
CONFIG_ARCS_HAL_IPC=y
CONFIG_ARCS_HAL_IPC_MASTER=y
CONFIG_ARCS_HAL_IPC_MRPC_SERVER=n
CONFIG_ARCS_HAL_IPC_MRPC_CLIENT=n
CONFIG_ARCS_HAL_IPC_PRINT=y
CONFIG_ARCS_HAL_IPC_PRINT_SOURCE_TAG="AP"
CONFIG_ARCS_HAL_LSF=n
CONFIG_IPC_LSF=n
CONFIG_LSF_CLIENT=n
CONFIG_DISK_MEM=n
CONFIG_DISK_MEM_CLIENT=n
CONFIG_DISK_MEM_SERVER=n

CONFIG_LOG=y
CONFIG_PRINTF_LOG_REDIRECT=y
CONFIG_BACK_TRACE=y

CONFIG_HEAP_SIZE=0x4000
CONFIG_PSRAM_HEAP_SIZE=0x300000
CONFIG_MAIN_TASK_STACK_SIZE=3072
CONFIG_MAIN_TASK_PRIORITY=1
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

CONFIG_LISA_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_PWM=y
CONFIG_LISA_SPI1=y
CONFIG_LISA_I2C=y
