CONFIG_MEM_CONFIG=y
CONFIG_ARCS_AP_CORE=y

CONFIG_LISA_LOG=y
CONFIG_PRINTF_LOG_REDIRECT=y
# Disable local console backend so AP logs only go through IPC writer;
# the test pattern matches the [REMOTE] prefix added by the CP reader.
CONFIG_LOG_BACKEND_CONSOLE=n

# Swapped roles: AP is the IPC master and still forwards its logs to the CP.
CONFIG_ARCS_HAL_IPC_MASTER=y
CONFIG_LOG_BACKEND_IPC_WRITER=y
