# lisa_pm 框架；HAL PM 子项由组件 Kconfig 自动 select
CONFIG_LISA_PM=y

# WiFi + 同核 LWIP
CONFIG_LISA_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y

# MAC Manager（默认走 LISA_KV，这里改成 chip ID）
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y

# DHCP 复用上次 IP，缩短连网时间（默认 n）
CONFIG_LWIP_DHCP_RESTORE_LAST_IP=y

# Console 改走 UART1，避免默认拉起 UART0
CONFIG_CONSOLE_UART_NAME="uart1"
CONFIG_CONSOLE_UART_BAUDRATE=115200

# Unity 测试框架
CONFIG_TEST_UNITY=y

# coreMQTT
CONFIG_SDK_MODULE_COREMQTT=y

# 异常 backtrace
CONFIG_BACK_TRACE=y

# CP 核应用：AP 由独立 remote 固件加载，关掉 SDK 内置 uboot 合并
# （CP 核默认 BOOT=y，需显式关掉）
CONFIG_BOOT=n
# AP 固件占 flash 起始 1MB（0x30000000-0x30100000），CP 镜像从 0x30100000 起
CONFIG_MEM_FLASH_BASE=0x30100000
CONFIG_MEM_FLASH_SIZE=0x00400000

# PM 快照区 64KB（落在 PSRAM 尾部），与本工程 SRAM/ILM/DLM retention 用量绑定
CONFIG_PM_SNAPSHOT_PSRAM_SIZE=0x10000

# 日志强制同步：异步模式默认 y
CONFIG_LOG_MODE_ASYNC=n
