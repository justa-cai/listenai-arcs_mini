# AP 核固件：仅做 PM 唤醒分支判断、引导 CP 后进入 WFI 空转
#
# 这是 wifi_pm 的"独立 AP 固件"，不再依赖 SDK 通用 uboot。
# 镜像直接落在 flash 起始 1MB（0x30000000-0x30100000），
# CP 镜像紧随其后从 0x30100000 起。

CONFIG_ARCS_AP_CORE=y
# 关闭 SDK 内置 uboot 合并：本镜像本身就是 AP 启动固件
CONFIG_BOOT=n

# AP 内存布局：使用 SDK Kconfig 默认值（ARCS_AP_CORE 默认 0x20034800 起 78KB）。
# CP 走默认 146KB（0x20010000-0x20034800），AP 紧跟其后，物理不重叠。
CONFIG_MEM_FLASH_BASE=0x30000000
CONFIG_MEM_FLASH_SIZE=0x00100000
# AP 不跑 WiFi
CONFIG_MEM_WFRAM_SIZE=0
CONFIG_MEM_WIFI_CALIBRATION_SIZE=0
CONFIG_MEM_WIFI_TRACE_SIZE=0
# PSRAM 物理上由 CP 全权管理；AP 这里只是把 PSRAM 区域声明出来，
# 让 SDK 的 scatload_psram / dcache 维护代码能链接通过。
# AP 不会把任何 .psram.* 段塞进去，scatload 表实际为空。
CONFIG_MEM_PSRAM_BASE=0x28000000
CONFIG_MEM_PSRAM_SIZE=0x01000000
# 与 CP 一致：不启用 LUNA 共享内存 / IPC 隔离 / APRAM
CONFIG_MEM_LUNA_SHARED_SIZE=0
CONFIG_MEM_IPC_ISOLATED=n
CONFIG_MEM_APRAM_SIZE=0

# SRAM 堆 32KB 给 SDK 启动 + FreeRTOS + UART/log buffer 用
# （默认 8KB 太小，会触发 heap_caps 失败回调直接 __builtin_trap）
CONFIG_HEAP_SIZE=0x8000
# AP 完全不用 PSRAM heap：注册 size=0 的 PSRAM heap 反而会让 MALLOC_CAP_DEFAULT
# 路径走到空 heap 后失败。直接禁用 PSRAM heap 模块，让所有 alloc 走 SRAM heap。

CONFIG_BACK_TRACE=y

# 日志走 UART1（与 CP 共用），方便观察启动顺序
CONFIG_CONSOLE_UART_NAME="uart1"
CONFIG_CONSOLE_UART_BAUDRATE=115200
CONFIG_SYSLOG_UART_DEVICE_UART1=y
CONFIG_SYSLOG_UART_PORT=1
CONFIG_SYSLOG_UART_BAUDRATE=115200
CONFIG_PRINTF_LOG_REDIRECT=y
