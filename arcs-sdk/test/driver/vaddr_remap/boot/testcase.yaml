tests:
  test.driver.vaddr_remap.boot_a:
    programmer: arcs
    runner: uart
    build_extra_args: "-c prj_boot_a.conf"
    images:
      - file: "vaddr_remap_test_boot.bin"
        address: "0x0"
      - file: "fw/vaddr_remap_fw.bin"
        address: "0x20000"
    log_analyzer:
      type: "regex"
      pattern: "Firmware A running!"

