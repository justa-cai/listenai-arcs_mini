CONFIG_ARCS_HAL_WARNING_DISABLE=y

CONFIG_ARCS_CP_CORE=y

CONFIG_MODULE_FREERTOS=y
CONFIG_MODULE_HEAP=y
CONFIG_LINK_OPTION_NOSYS_SPECS=y

CONFIG_EASYLOGGER_ASYNC_BUF_SIZE=0x1000

CONFIG_LOG=y
CONFIG_SYSLOG_PRINTK_REDIRECT=y

CONFIG_SYSLOG_UART_TX_PIN=3
CONFIG_SYSLOG_UART_TX_PIN_FUNC_SEL=2
CONFIG_SYSLOG_UART_PORT=0
CONFIG_SYSLOG_UART_BAUDRATE=921600

CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y

CONFIG_BACK_TRACE=y

CONFIG_HEAP_SIZE=0x3C00

CONFIG_PSRAM_HEAP_SIZE=0x3b0000

CONFIG_FILE_SYSTEM=y
CONFIG_FATFS_FILESYSTEM=y

CONFIG_DISK_DRIVER=y
CONFIG_DISK_DRIVER_SDMMC=y


CONFIG_LISA_SDMMC_DEVICE=y
CONFIG_LISA_DEVICE=y

CONFIG_LSFS=y
CONFIG_LSFS_FAT=y
CONFIG_LSFS_REGISTER_VFS=y

CONFIG_LVFS=y
CONFIG_LVFS_POSIX_API=y
CONFIG_LVFS_POSIX_API_ALIAS=y

CONFIG_TEST_UNITY=y
