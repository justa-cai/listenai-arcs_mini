# Minimal config — enable easylogger frontend for Rust log output to be visible.
CONFIG_LOG_FRONTEND_EASYLOGGER=y

# Enable GPIO + UART devices used by the test subtests.
# gpioa: test_gpio_open. gpiob: test_eh_gpio_traits drives gpiob:9 (on-board LED)
# via embedded-hal OutputPin/StatefulOutputPin. uart1: test_uart_open.
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_UART_DEVICE=y
CONFIG_LISA_UART1=y

# R3 peripherals exercised by test_pwm/rtc/adc/flash subtests.
CONFIG_LISA_PWM=y
CONFIG_LISA_RTC=y
CONFIG_LISA_ADC=y
CONFIG_LISA_FLASH=y
