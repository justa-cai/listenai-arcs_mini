[workspace]
resolver = "2"
members = [
    "arcs",
    "arcs-macros",
    "arcs-embassy",
]
default-members = [
    "arcs",
    "arcs-macros",
    "arcs-embassy",
]

[workspace.package]
edition      = "2021"
rust-version = "1.83"
license      = "Apache-2.0"

[workspace.dependencies]
arcs             = { path = "arcs" }
arcs-macros      = { path = "arcs-macros" }
arcs-embassy     = { path = "arcs-embassy" }
log              = { version = "0.4", default-features = false }
heapless         = { version = "0.8" }
embedded-hal           = { version = "1.0", default-features = false }
embedded-io            = { version = "0.6", default-features = false }
embedded-storage       = { version = "0.3", default-features = false }
embedded-graphics-core = { version = "0.4", default-features = false }
embedded-graphics      = { version = "0.8" }
embassy-executor         = { version = "=0.9.1", default-features = false }
embassy-time             = { version = "=0.4.0", default-features = false, features = ["tick-hz-1_000_000", "generic-queue-8"] }
embassy-time-driver      = "=0.2.0"
embassy-time-queue-utils = "=0.1.0"
embassy-sync             = "0.6"
embedded-hal-async       = "1.0"
critical-section         = { version = "1.1", features = ["restore-state-u8"] }
static_cell              = "2"
