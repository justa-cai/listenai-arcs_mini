CONFIG_LISA_DEVICE=y
CONFIG_LISA_AUDIO_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_PWM=y
CONFIG_LISA_SPI1=y
CONFIG_LISA_I2C=y
CONFIG_LISA_I2C0=y

CONFIG_LISA_DISPLAY_DEVICE=y
CONFIG_LISA_DISPLAY_PANEL_ST7789P3=y
CONFIG_LISA_DISPLAY_CPDMA_ROTATE=n
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=320
CONFIG_PANEL_ST7789P3_X_OFFSET=0
CONFIG_LISA_DISPLAY_COLOR_INVERT=y

CONFIG_LISA_DISPLAY_BUS_SPI_4WIRE=y
CONFIG_LISA_TOUCH_DEVICE=y
CONFIG_LISA_TOUCH_ARCS_CST328=y

# LVGL8 配置
CONFIG_SDK_MODULE_LVGL8=y
CONFIG_LV_DEMO_SYS_HEAP=y
CONFIG_LV_DRIVER_PIXEL_ALIGN_SIZE=16
CONFIG_LV_USE_DEMO_WIDGETS=y
CONFIG_LV_USE_GPU_CSK_DMA2D=y
CONFIG_LV_DOUBLE_VDB=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_DRIVER_FULL_REFRESH=y
CONFIG_LV_CUSTOM_MONITOR=n
CONFIG_LV_REFR_UNCONDITIONAL_AREA_JOIN=y
CONFIG_LV_DRIVER_ROTATE_270=y
CONFIG_LV_ATTRIBUTE_FAST_MEM_USE_IRAM=y

CONFIG_PSRAM_HEAP_SIZE=0x100000
CONFIG_HEAP_SIZE=0x10000

CONFIG_FILE_SYSTEM=y
CONFIG_FATFS_FILESYSTEM=y
CONFIG_DISK_DRIVER=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_LSFS=y
CONFIG_LSFS_FAT=y
CONFIG_LSFS_REGISTER_VFS=y
CONFIG_LVFS=y
CONFIG_LVFS_POSIX_API=y
CONFIG_LVFS_POSIX_API_ALIAS=y
CONFIG_LISA_SDMMC_DEVICE=y

CONFIG_DIRENT=y

# NES performance observation defaults: keep low-overhead FPS logs on, but
# leave heavy core/opcode profiling opt-in for targeted analysis.
CONFIG_GAME_NES_AUDIO_FAST_S16_COPY=y
CONFIG_GAME_NES_PERF_LOG_ENABLE=y
# Optional USB Host keyboard input. Enable to use a USB Hub + USB keyboard
# as NES player-1 controls.
# CONFIG_GAME_NES_USB_HOST_KEYBOARD is not set
# Preselect the ARCS EVB MUSB host controller; it is inert while
# CONFIG_GAME_NES_USB_HOST_KEYBOARD keeps CherryUSB Host disabled.
CONFIG_CHERRYUSB_HOST_MUSB_LISA=y
CONFIG_GAME_NES_CORE_PROFILE_ENABLE=n
CONFIG_GAME_NES_CPU_OPCODE_PROFILE_ENABLE=n
CONFIG_GAME_NES_CHR_PACKED_DYNAMIC_MAX_BYTES=262144
