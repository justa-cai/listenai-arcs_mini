# VenusA face-detect CP demo for csk7s_yt_evb.
# AP remote-ap and algorithm resources occupy the low flash area; keep the CP
# image at 0x30800000 as in the ARCS face_detect demo.
CONFIG_HARTID=1
CONFIG_BOOT=n

CONFIG_MEM_FLASH_BASE=0x30800000
CONFIG_MEM_FLASH_SIZE=0x00800000

CONFIG_MEM_PSRAM_BASE=0x38800000
CONFIG_MEM_PSRAM_SIZE=0x00800000


# C runtime / C++ runtime
CONFIG_LINK_OPTION_NONE_SPECS=y
CONFIG_LINK_CPP_RUNTIME_SECTIONS=n
CONFIG_CPP_EXCEPTIONS=n

# Heap
CONFIG_HEAP_SIZE=0x3000
CONFIG_PSRAM_HEAP_SIZE=0x680000

# Image input. csk7s_yt_evb currently uses SC030IOT over DVP, which outputs
# 640x480 YUV422 and the VenusA FD library accepts that format directly.
CONFIG_IMAGE_WIDTH=640
CONFIG_IMAGE_HEIGHT=480
CONFIG_IMAGE_FORMAT=2

# Optional USB Video Class output. The first implementation exports the live
# YUV422 camera frame as YUY2 640x480@10fps over CherryUSB HS device mode.
CONFIG_FACE_DETECT_UVC_ENABLE=y
CONFIG_FACE_DETECT_UVC_FPS=10
CONFIG_FACE_DETECT_UVC_DRAW_FACE_BOX=y
CONFIG_FACE_DETECT_UVC_BOX_THICKNESS=2
CONFIG_FACE_DETECT_UVC_BOX_TIMEOUT_MS=800
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_DEVICE=y
CONFIG_CHERRYUSB_DEVICE_VIDEO=y
CONFIG_CHERRYUSB_DEVICE_MUSB_LISA=y
CONFIG_CHERRYUSB_DEVICE_SPEED_HS=y
CONFIG_USB_MUSB_EP_NUM=8
CONFIG_USBDEV_REQUEST_BUFFER_LEN=512

# Debug / FreeRTOS / main task
CONFIG_BACK_TRACE=y
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y
CONFIG_MAIN_TASK_STACK_SIZE=8192
CONFIG_MAIN_TASK_PRIORITY=5
CONFIG_WORK_QUEUE=y

# VenusA IPC backend for CP <-> remote-ap communication.
# CONFIG_ARCS_HAL_LSF is not set
# CONFIG_IPC_LSF is not set
CONFIG_IPC_CIDU=y
CONFIG_DISK_MEM=n

# ACOMP FD master side
CONFIG_ACOMP=y
CONFIG_ACOMP_FD=y
CONFIG_ACOMP_MASTER=y

CONFIG_ACOMP_LOGGER=y


# VenusA face resources: detect / align / verify only. No live model.
CONFIG_ACOMP_FD_RES_FACE_DETECT_ADDRESS=0x30100000
CONFIG_ACOMP_FD_RES_FACE_DETECT_LENGTH=449848
CONFIG_ACOMP_FD_RES_FACE_ALIGN_ADDRESS=0x30170000
CONFIG_ACOMP_FD_RES_FACE_ALIGN_LENGTH=1446204
CONFIG_ACOMP_FD_RES_FACE_LIVE_ADDRESS=0x0
CONFIG_ACOMP_FD_RES_FACE_LIVE_LENGTH=0
CONFIG_ACOMP_FD_FACE_VERIFY_ADDRESS=0x302E0000
CONFIG_ACOMP_FD_FACE_VERIFY_LENGTH=1078296

# Face-detect demo policy
CONFIG_FACE_LIVE_DETECT_ENABLE=n

# Device framework and camera path. csk7s_yt_evb exposes DVP and camera I2C.
CONFIG_LISA_DEVICE=y
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_I2C=y
CONFIG_LISA_I2C1=y
CONFIG_LISA_CAMERA_DEVICE=y
CONFIG_LISA_CAMERA_BUS_DVP=y
CONFIG_LISA_CAMERA_SENSOR_SC030IOT=y
CONFIG_LISA_UART_DEVICE=y
CONFIG_LISA_UART1=y

# PA04 physical KEY uses GPIO input, not ADC.
CONFIG_BUTTON=y
CONFIG_GPIO_BUTTON=y

# Log
CONFIG_LOG=y
CONFIG_LOG_MODE_ASYNC=n
