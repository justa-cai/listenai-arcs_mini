CONFIG_HEAP_SIZE=0x08000
CONFIG_PSRAM_HEAP=y
CONFIG_PSRAM_HEAP_SIZE=0x20000

# DISK驱动使能
CONFIG_DISK_DRIVER=n

CONFIG_ARCS_HAL_PM=y
CONFIG_ARCS_HAL_PM_UART_WAKEUP=y
CONFIG_ARCS_HAL_PM_KEEP_ALIVE=y
CONFIG_ARCS_HAL_PM_DEBUG=y
CONFIG_ARCS_HAL_PM_CLOSE_AP=y

# 文件系统配置
CONFIG_FILE_SYSTEM=n
CONFIG_FATFS_FILESYSTEM=n
CONFIG_LSFS=n
CONFIG_LSFS_FAT=n
CONFIG_LSFS_REGISTER_VFS=n
CONFIG_LVFS_POSIX_API_ALIAS=n
CONFIG_LVFS=n
CONFIG_LVFS_POSIX_API=n
CONFIG_FS_ENV_MEMORY_MANAGEMENT_USE_PSRAM=n

# WiFi LA dump 不需要，节省 SRAM
CONFIG_MEM_WIFI_LA_DUMP_SIZE=0

# 网络配置
CONFIG_LISA_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y
CONFIG_LISA_WIFI_CB_TASK_STACK_SIZE=4096
CONFIG_LWIP_NETAL_TX_BUF_CNT=4

# MAC Manager
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y

# WIFI MANAGER (不再使用 wifi_mgr，直接调用 wifi_sta_connect)
CONFIG_WIFI_MANAGER=n

# LWIP DHCP
CONFIG_LWIP_DHCP_RESTORE_LAST_IP=y

# LISA Shell
CONFIG_LISA_SHELL=n

CONFIG_SYSLOG_PRINTF_REDIRECT=y

# Console 改走 UART1，避免默认拉起 UART0
CONFIG_CONSOLE_UART_NAME="uart1"
CONFIG_CONSOLE_UART_BAUDRATE=115200

CONFIG_SYSLOG_UART_DEVICE_UART1=y
CONFIG_SYSLOG_UART_PORT=1
CONFIG_SYSLOG_UART_BAUDRATE=115200

# LISA Porting
CONFIG_LISA_PORTING=y

# SD Card drivers
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_LISA_SDMMC_DEVICE=n

CONFIG_LISA_OS=y
CONFIG_LISA_KV=n
CONFIG_LISA_NETWORK=y

# coreMQTT
CONFIG_SDK_MODULE_COREMQTT=y

CONFIG_BACK_TRACE=y

# 自定义 memap.h 和 system.ld
CONFIG_MEM_CONFIG_USE_CUSTOM_FILE=y
CONFIG_ARCS_STARTUP_CUSTOM_LINKER_FILE=y

CONFIG_EASYLOGGER_ASYNC_BUF_SIZE=4096    # 从 10240 降到 4096
CONFIG_LOG_ASYNC_BUF_SIZE=512
CONFIG_EASYLOGGER_LINE_BUF_SIZE=512      # 从 1024 降到 512

CONFIG_LOG_MODE_ASYNC=n
CONFIG_EASYLOGGER_LOG_MODE_ASYNC=n

CONFIG_ARCS_HAL_WCND_GPADC_IC_MUTEX=n
CONFIG_ARCS_HAL_IC_MUTEX=n

# Boot
CONFIG_BOOT=y
CONFIG_BOOT_FLASH_SIZE=0x4000
CONFIG_BOOT_CP_ENTRY=0x30004000
CONFIG_BOOT_LOG_LVL_NON=y
CONFIG_BOOT_WITH_WATCHDOG=n

CONFIG_LISA_ADC=y
